# Nginx para SIGEA en el servidor del GORE (Debian 13). Copiar a /etc/nginx/sites-available/sigea,
# cambiar el dominio y luego:  sudo certbot --nginx -d <dominio>   (agrega el certificado y el bloque 443)
# Guía: docs/despliegue-servidor-linux.md

server {
    listen 80;
    listen [::]:80;
    server_name informes.regionmoquegua.gob.pe;    # ← dominio real

    # Mayor que MAX_ARCHIVO_MB (PDF de hasta 10 MB + el resto del formulario)
    client_max_body_size 15M;

    # Las cabeceras de seguridad (CSP, X-Frame-Options, HSTS…) ya las pone la app
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # La app usa la IP real del visitante (límite de intentos de login, bitácora): TRUST_PROXY=1
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;      # subir un PDF grande y extraer su texto
        proxy_send_timeout 120s;
    }
}
